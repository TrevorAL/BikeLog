name: Deploy to Stage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to deploy (required). Use build-v<version> from Version Summary."
        required: true
        type: string
      previous_version:
        description: "Previous stage version (optional, example: 1.7.5-stage.2)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to stage
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stage
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs and secrets
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REF_RAW="${{ inputs.source_ref }}"
          PREVIOUS_VERSION="${{ inputs.previous_version }}"
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          git fetch --tags --prune origin

          if [ -z "${SOURCE_REF_RAW}" ]; then
            echo "source_ref is required."
            exit 1
          fi

          SOURCE_REF="${SOURCE_REF_RAW}"

          if ! git rev-parse -q --verify "${SOURCE_REF}^{commit}" >/dev/null; then
            echo "Unable to resolve source_ref '${SOURCE_REF}'."
            echo "Provide a valid ref (recommended: build-v<version> from Version Summary)."
            exit 1
          fi

          SOURCE_REF_NAME="${SOURCE_REF#refs/tags/}"
          SOURCE_REF_NAME="${SOURCE_REF_NAME#origin/}"
          VERSION=""

          if [[ "${SOURCE_REF_NAME}" =~ ^build-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${SOURCE_REF_NAME}" =~ ^stage-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${SOURCE_REF_NAME}" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi

          if [ -z "${VERSION}" ] || [[ ! "${VERSION}" =~ ${VERSION_PATTERN} ]]; then
            echo "Unable to derive a valid version from source_ref '${SOURCE_REF}'."
            echo "Use a tag like build-v1.2.3, stage-v1.2.3, or v1.2.3."
            exit 1
          fi

          if [ -n "${PREVIOUS_VERSION}" ]; then
            PREVIOUS_VERSION="${PREVIOUS_VERSION#stage-v}"
            PREVIOUS_VERSION="${PREVIOUS_VERSION#v}"
            if [[ ! "${PREVIOUS_VERSION}" =~ ${VERSION_PATTERN} ]]; then
              echo "Invalid previous_version: ${PREVIOUS_VERSION}. Use semver-like values."
              exit 1
            fi
            PREVIOUS_TAG="stage-v${PREVIOUS_VERSION}"
          else
            PREVIOUS_TAG="$(git tag --list 'stage-v*' --sort=-version:refname | grep -vx "stage-v${VERSION}" | head -n 1 || true)"
            if [ -z "${PREVIOUS_TAG}" ]; then
              PREVIOUS_TAG="none"
            fi
          fi

          if [ -z "${DATABASE_URL}" ] || [ -z "${DIRECT_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL or STAGING_DIRECT_URL."
            exit 1
          fi

          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Missing Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check out deploy source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="${{ steps.validate.outputs.source_ref }}"
          git checkout --detach "${SOURCE_REF}"
          git --no-pager show -s --oneline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Apply stage database migrations
        run: npm run db:migrate:deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Build Vercel artifacts for stage
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Deploy stage build
        id: deploy
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")"
          echo "url=${DEPLOYMENT_URL}" >> "${GITHUB_OUTPUT}"

      - name: Alias stage domain
        run: vercel alias set "${{ steps.deploy.outputs.url }}" bike-log-staging.vercel.app --token="${VERCEL_TOKEN}"

      - name: Create and push stage version tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate.outputs.version }}"
          TAG="stage-v${VERSION}"
          CURRENT_COMMIT="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            EXISTING_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "${EXISTING_COMMIT}" = "${CURRENT_COMMIT}" ]; then
              echo "Tag ${TAG} already exists on this commit; skipping tag creation."
              exit 0
            fi
            echo "Tag ${TAG} already exists on a different commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Stage release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Publish deployment summary
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          CURRENT_TAG="stage-v${VERSION}"
          PREVIOUS_TAG="${{ steps.validate.outputs.previous_tag }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SOURCE_REF="${{ steps.validate.outputs.source_ref }}"

          {
            echo "## Stage Deployment Complete"
            echo "- Version: \`${CURRENT_TAG}\`"
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Previous version: \`${PREVIOUS_TAG}\`"
            echo "- Deployment URL: ${{ steps.deploy.outputs.url }}"
            if [ "${PREVIOUS_TAG}" = "none" ]; then
              echo "- Compare: n/a (first stage release)"
            else
              echo "- Compare: ${REPO_URL}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
