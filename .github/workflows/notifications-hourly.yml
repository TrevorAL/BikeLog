name: Scheduled Notification Dispatch

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications-hourly-dispatch
  cancel-in-progress: false

jobs:
  dispatch-prod:
    name: Dispatch notifications (prod)
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ secrets.PROD_NOTIFICATIONS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.PROD_VERCEL_BYPASS_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production cron configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${TARGET_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing PROD_NOTIFICATIONS_CRON_URL or PROD_CRON_SECRET. Skipping production dispatch."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            normalized_url="$(.github/scripts/normalize-notifications-cron-url.sh PROD_NOTIFICATIONS_CRON_URL "${TARGET_URL}")"
            echo "TARGET_URL=${normalized_url}" >> "${GITHUB_ENV}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Call production cron endpoint
        if: ${{ steps.config.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          curl_args=(
            -sS
            -o response.json
            -w "%{http_code}"
            -H "Authorization: Bearer ${CRON_SECRET}"
          )
          if [ -n "${VERCEL_BYPASS_SECRET}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi
          status_code="$(curl "${curl_args[@]}" "${TARGET_URL}")"
          cat response.json || true
          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Production notification dispatch failed with HTTP ${status_code}"
            exit 1
          fi

  dispatch-stage:
    name: Dispatch notifications (stage)
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ secrets.STAGING_NOTIFICATIONS_CRON_URL }}
      CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_BYPASS_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check stage cron configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${TARGET_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing STAGING_NOTIFICATIONS_CRON_URL or STAGING_CRON_SECRET. Skipping stage dispatch."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            normalized_url="$(.github/scripts/normalize-notifications-cron-url.sh STAGING_NOTIFICATIONS_CRON_URL "${TARGET_URL}")"
            echo "TARGET_URL=${normalized_url}" >> "${GITHUB_ENV}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Call stage cron endpoint
        if: ${{ steps.config.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          curl_args=(
            -sS
            -o response.json
            -w "%{http_code}"
            -H "Authorization: Bearer ${CRON_SECRET}"
          )
          if [ -n "${VERCEL_BYPASS_SECRET}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi
          status_code="$(curl "${curl_args[@]}" "${TARGET_URL}")"
          cat response.json || true
          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Stage notification dispatch failed with HTTP ${status_code}"
            exit 1
          fi
