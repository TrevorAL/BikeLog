name: Main

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bikelog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bikelog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bikelog_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bikelog_test?schema=public
      AUTH_SECRET: ci-test-auth-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync schema
        run: npm run db:push

      - name: Run integration tests
        run: |
          TEST_FILES="$(find tests/integration -type f -name '*.test.ts' -print)"
          if [ -z "$TEST_FILES" ]; then
            echo "No integration tests found."
            exit 1
          fi
          node --import tsx --test $TEST_FILES

  version_summary:
    name: Version Summary
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version metadata
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="v${BASE_VERSION}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

          LAST_PROD_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)"
          LAST_STAGE_TAG="$(git tag --list 'stage-v*' --sort=-version:refname | head -n 1 || true)"
          echo "last_prod_tag=${LAST_PROD_TAG:-none}" >> "${GITHUB_OUTPUT}"
          echo "last_stage_tag=${LAST_STAGE_TAG:-none}" >> "${GITHUB_OUTPUT}"

          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            COMMIT_LINES="$(git log --pretty=format:'- `%h` %s (%an)' "${BEFORE_SHA}..${CURRENT_SHA}")"
          else
            COMMIT_LINES="$(git log --pretty=format:'- `%h` %s (%an)' -n 20 "${CURRENT_SHA}")"
          fi

          if [ -z "${COMMIT_LINES}" ]; then
            COMMIT_LINES="- No commits found in merge range."
          fi

          COMMITS_B64="$(printf '%s' "${COMMIT_LINES}" | base64 | tr -d '\n')"
          echo "commits_b64=${COMMITS_B64}" >> "${GITHUB_OUTPUT}"

      - name: Create build version tag
        id: build_tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          TAG="build-${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Build tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Build ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish version summary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          LAST_PROD_TAG="${{ steps.version.outputs.last_prod_tag }}"
          LAST_STAGE_TAG="${{ steps.version.outputs.last_stage_tag }}"
          COMMIT_LINES="$(printf '%s' '${{ steps.version.outputs.commits_b64 }}' | base64 --decode)"
          BUILD_TAG="${{ steps.build_tag.outputs.tag }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          {
            echo "### BikeLog / Version / Version Summary"
            echo ""
            echo "\`${VERSION}\`"
            echo ""
            echo "- Latest prod tag: \`${LAST_PROD_TAG}\`"
            echo "- Latest stage tag: \`${LAST_STAGE_TAG}\`"
            echo "- Build tag (deploy source ref): \`${BUILD_TAG}\`"
            echo ""
            echo "<details>"
            echo "<summary>Commits</summary>"
            echo ""
            echo "${COMMIT_LINES}"
            echo ""
            echo "</details>"
            echo ""
            echo "Compare: ${REPO_URL}/compare/${{ github.event.before }}...${{ github.sha }}"
          } >> "${GITHUB_STEP_SUMMARY}"
